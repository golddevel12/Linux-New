<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BearlyOS Glass</title>
<style>
  :root{
    --accent:#F4A63B;
    --glass:rgba(255,255,255,.14);
    --glass-strong:rgba(255,255,255,.22);
    --stroke:rgba(255,255,255,.35);
    --text:#f6f6f8;
    --muted:rgba(246,246,248,.65);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
    color:var(--text);height:100vh;overflow:hidden;position:relative;
    background:#0b0b10;
  }
  /* kleurrijke achtergrond-blobs zodat het glas echt 'refracteert' */
  .bg{position:absolute;inset:0;overflow:hidden;z-index:0}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75}
  .b1{width:46vw;height:46vw;left:-6vw;top:-8vw;background:#F4A63B}
  .b2{width:40vw;height:40vw;right:-6vw;top:6vw;background:#2bb6a8}
  .b3{width:50vw;height:50vw;left:18vw;bottom:-18vw;background:#7b5cff}
  .b4{width:30vw;height:30vw;right:14vw;bottom:-6vw;background:#ff5c8a;opacity:.6}
  .grain{position:absolute;inset:0;background:radial-gradient(120% 120% at 50% 20%,transparent,rgba(0,0,0,.45))}

  /* ---------- Liquid Glass basis ---------- */
  .glass{
    background:var(--glass);
    backdrop-filter:blur(26px) saturate(170%);
    -webkit-backdrop-filter:blur(26px) saturate(170%);
    border:1px solid var(--stroke);
    box-shadow:0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.45);
    position:relative;
  }
  .glass::after{ /* specular glans bovenaan */
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 42%);
    mix-blend-mode:screen;
  }

  /* ---------- Menubalk ---------- */
  .menubar{
    position:absolute;top:0;left:0;right:0;height:38px;z-index:30;
    display:flex;align-items:center;gap:20px;padding:0 16px;border-radius:0;
    border-left:none;border-right:none;border-top:none;
  }
  .menubar img{height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .menubar .name{font-weight:700;letter-spacing:.3px}
  .menubar .item{font-size:13.5px;color:var(--text);opacity:.9}
  .menubar .right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:13px}
  .menubar .dot-accent{color:var(--accent)}

  /* ---------- Venster ---------- */
  .window{
    position:absolute;left:50%;top:92px;transform:translateX(-50%);
    width:min(760px,86vw);height:min(440px,60vh);border-radius:18px;overflow:hidden;z-index:20;
    display:grid;grid-template-columns:200px 1fr;
  }
  .titlebar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;
            padding:0 16px;gap:8px;z-index:5}
  .tl{width:12px;height:12px;border-radius:50%}
  .tl1{background:#ff5f57}.tl2{background:#febc2e}.tl3{background:#28c840}
  .titlebar .tt{margin-left:14px;font-size:13px;color:var(--muted)}
  .sidebar{padding:58px 12px 12px;border-right:1px solid rgba(255,255,255,.15);
           background:rgba(255,255,255,.06)}
  .sb{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px;
      color:var(--text);margin-bottom:2px}
  .sb.active{background:var(--accent);color:#1a1206;font-weight:600}
  .sb .ic{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.5)}
  .sb.active .ic{background:#1a1206}
  .content{padding:58px 18px 18px;overflow:hidden}
  .cardrow{display:flex;gap:14px;flex-wrap:wrap}
  .card{width:140px;height:96px;border-radius:14px;}
  .card .cap{position:absolute;left:12px;bottom:10px;font-size:12px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
        font-size:13px;margin-top:16px}
  .chip .k{width:9px;height:9px;border-radius:50%;background:var(--accent);
           box-shadow:0 0 8px var(--accent)}

  /* ---------- Dock ---------- */
  .dock{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;
    display:flex;align-items:flex-end;gap:12px;padding:10px 14px;border-radius:22px;
  }
  .app{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;
       transition:transform .18s ease;cursor:default;position:relative;
       box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.3)}
  .app:hover{transform:translateY(-10px) scale(1.12)}
  .app img{width:34px;height:34px}
  .a-brave{background:linear-gradient(145deg,#ff7139,#eb4d1b)}
  .a-term{background:linear-gradient(145deg,#2a2a33,#15151a)}
  .a-code{background:linear-gradient(145deg,#2aa3ff,#1667d6)}
  .a-files{background:linear-gradient(145deg,#ffcf5c,#f4a63b)}
  .a-bear{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid var(--stroke)}
  .app .emoji{font-size:24px}

  .hint{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);z-index:30;
        font-size:12px;color:var(--muted);background:rgba(0,0,0,.25);padding:5px 12px;border-radius:999px;
        backdrop-filter:blur(8px)}
</style>
</head>
