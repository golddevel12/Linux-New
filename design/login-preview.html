<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BearlyOS Login</title>
<style>
  :root{
    --bg1:#1b1b21; --bg2:#070708;
    --line:#f4f4f6; --muted:#8a8a95; --accent:#d8d8de;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(130% 130% at 50% 40%, var(--bg1) 0%, var(--bg2) 70%);
    color:var(--line);min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:34px;overflow:hidden;position:relative;
  }
  /* top clock, like a lock screen */
  .clock{position:absolute;top:46px;left:50%;transform:translateX(-50%);text-align:center}
  .clock .t{font-size:40px;font-weight:300;letter-spacing:1px}
  .clock .d{font-size:14px;color:var(--muted);margin-top:4px;text-transform:capitalize}

  .stage{position:relative;width:360px;height:360px;display:grid;place-items:center}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}

  /* faint fixed track */
  .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1.5}

  /* rotating arc + button dot */
  .spin-fast{transform-origin:50% 50%;animation:spin 9s linear infinite}
  .arc{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;
       stroke-dasharray:120 900;opacity:.9}
  .btn{fill:var(--line)}
  .btn-glow{fill:rgba(255,255,255,.18)}

  /* circular text, slow, opposite direction */
  .spin-slow{transform-origin:50% 50%;animation:spin 26s linear infinite reverse}
  .ring-text{fill:var(--line);font-size:17px;font-weight:600;letter-spacing:7px}

  @keyframes spin{to{transform:rotate(360deg)}}

  .bear{width:180px;height:auto;filter:drop-shadow(0 6px 30px rgba(0,0,0,.6));
        animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

  .brand{text-align:center;margin-top:-6px}
  .brand h1{font-size:30px;font-weight:600;letter-spacing:4px}
  .brand p{color:var(--muted);font-size:13px;letter-spacing:3px;margin-top:6px;text-transform:uppercase}

  /* login field */
  .login{display:flex;flex-direction:column;align-items:center;gap:14px}
  .user{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
  .dot{width:7px;height:7px;border-radius:50%;background:#4ad07d}
  .field{display:flex;align-items:center;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:11px 18px;width:260px;
    backdrop-filter:blur(8px)}
  .field input{flex:1;background:none;border:none;outline:none;color:var(--line);
    font-size:15px;letter-spacing:1px}
  .field input::placeholder{color:var(--muted)}
  .field .go{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:pointer}
  .hint{color:var(--muted);font-size:12px;letter-spacing:.3px}
</style>
</head>
<body>
  <div class="clock"><div class="t" id="t">21:42</div><div class="d" id="d">woensdag 7 oktober</div></div>

  <div class="stage">
    <svg viewBox="0 0 360 360" aria-hidden="true">
      <defs>
        <path id="tcircle" d="M180,180 m-150,0 a150,150 0 1,1 300,0 a150,150 0 1,1 -300,0"/>
      </defs>

      <!-- fixed faint tracks -->
      <circle class="track" cx="180" cy="180" r="150"/>
      <circle class="track" cx="180" cy="180" r="128" style="stroke:rgba(255,255,255,.05)"/>

      <!-- rotating arc with a button dot -->
      <g class="spin-fast">
        <circle class="arc" cx="180" cy="180" r="150"/>
        <circle class="btn-glow" cx="180" cy="30" r="11"/>
        <circle class="btn" cx="180" cy="30" r="5.5"/>
      </g>

      <!-- circular rotating text -->
      <g class="spin-slow">
        <text class="ring-text"><textPath href="#tcircle" startOffset="0">
          BEARLYOS · BEARLYOS · BEARLYOS · BEARLYOS ·
        </textPath></text>
      </g>
    </svg>
