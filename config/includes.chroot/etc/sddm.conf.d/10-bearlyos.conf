# BearlyOS login-manager (SDDM) met het animatie-thema.
# In de live-sessie logt "bear" automatisch in zodat het installatie-
# programma start. Het installatieprogramma herschrijft deze instelling
# op het geïnstalleerde systeem, zodat daar wél het login-scherm verschijnt.
[Theme]
Current=bearlyos

[Autologin]
User=bear
Session=gnome.desktop
Relogin=false
