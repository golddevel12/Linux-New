name: Build ISO

on:
  # Handmatig starten via het tabblad "Actions" → "Build ISO" → "Run workflow"
  workflow_dispatch:
  # Automatisch een Release maken bij een versietag, bijv. v1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Schijfruimte vrijmaken
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Versie bepalen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: ISO bouwen (in Debian-container)
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            -e DISTRO_VERSION="${{ steps.version.outputs.version }}" \
            debian:bookworm \
            bash -c "apt-get update && apt-get install -y live-build && ./build.sh"

      - name: Grootte controleren
        run: |
          ls -lh out/
          size=$(stat -c %s out/*.iso)
          if [ "$size" -ge 2147483648 ]; then
            echo "::error::ISO is groter dan 2 GB; GitHub Releases accepteert dat niet. Verwijder pakketten uit config/package-lists."
            exit 1
          fi

      - name: Uploaden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ steps.version.outputs.version }}
          path: out/
          compression-level: 0
          retention-days: 14

      - name: Release publiceren
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          files: |
            out/*.iso
            out/*.sha256
