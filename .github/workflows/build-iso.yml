name: Build ISO

on:
  workflow_dispatch:          # handmatig: Actions -> Build ISO -> Run workflow
  push:
    tags:
      - "v*"                   # een tag zoals v1.0 maakt automatisch een Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Schijfruimte vrijmaken
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Versie bepalen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: ISO bouwen (in Debian-container)
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            -e DISTRO_VERSION="${{ steps.version.outputs.version }}" \
            debian:bookworm \
            bash -c "apt-get update && apt-get install -y live-build git curl ca-certificates libcap2-bin && ./build.sh"

      - name: Rechten herstellen (out/ is door root in de container gemaakt)
        run: sudo chown -R "$USER:$USER" out

      - name: ISO opsplitsen voor de Release (>2 GB, alleen bij een tag)
        id: pkg
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd out
          iso="$(ls *.iso)"
          size=$(stat -c %s "$iso")
          echo "ISO: $iso ($size bytes)"
          limit=2000000000
          if [ "$size" -ge "$limit" ]; then
            echo "ISO > 2 GB: opsplitsen in delen van 1900 MB..."
            split -b 1900M -d --additional-suffix=.part "$iso" "${iso}."
            rm -f "$iso"
            ls -lh
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "ISO past als één bestand."
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Uploaden als artifact (bij handmatige run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: bearlyos-${{ steps.version.outputs.version }}
          path: out/
          compression-level: 0
          retention-days: 14

      - name: Release-tekst maken
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "## BearlyOS ${{ steps.version.outputs.version }}"
            echo ""
            if [ "${{ steps.pkg.outputs.split }}" = "true" ]; then
              echo "> De ISO is te groot voor één GitHub-bestand en is opgesplitst in \`.part\`-delen."
              echo "> Download **alle** \`.part\`-bestanden en voeg ze weer samen:"
              echo ""
              echo '**Linux / macOS:**'
              echo '```bash'
              echo 'cat bearlyos-*.iso.*.part > bearlyos.iso'
              echo '```'
              echo ""
              echo '**Windows (PowerShell):**'
              echo '```powershell'
              echo 'cmd /c copy /b (($(Get-ChildItem *.part | Sort-Object Name).Name) -join "+") bearlyos.iso'
              echo '```'
              echo ""
              echo "Controleer daarna met het \`.sha256\`-bestand en zet \`bearlyos.iso\` op een USB-stick."
            else
              echo "Download de \`.iso\`, controleer eventueel met \`.sha256\`, en zet hem op een USB-stick."
            fi
            echo ""
            echo "Zie de README voor het op USB zetten en opstarten."
          } > release-notes.md

      - name: Release publiceren
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: BearlyOS ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            out/*
