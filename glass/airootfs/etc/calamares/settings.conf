# BearlyOS Glass — Calamares installer (Arch / archiso)
---
modules-search: [ local ]

instances:
- id: prepare
  module: shellprocess
  config: shellprocess_prepare.conf
- id: cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@prepare
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - shellprocess@cleanup
  - initcpio
  - bootloader
  - umount
- show:
  - finished

branding: bearlyos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
