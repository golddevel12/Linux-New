# Draait BUITEN de chroot, direct na het uitpakken van het systeem.
---
dontChroot: true
timeout: 120
script:
    # De kernel zit niet in de squashfs, maar wel op het installatiemedium.
    - "mkdir -p ${ROOT}/boot"
    - "cp -f /run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux ${ROOT}/boot/vmlinuz-linux"
    # Neem de werkende mirrorlist van de live-sessie mee.
    - "mkdir -p ${ROOT}/etc/pacman.d"
    - "cp -f /etc/pacman.d/mirrorlist ${ROOT}/etc/pacman.d/mirrorlist"
