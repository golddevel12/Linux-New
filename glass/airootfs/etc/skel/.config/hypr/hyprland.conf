# BearlyOS Glass — Hyprland
# Liquid-glass gevoel: blur, afgeronde hoeken, vloeiende animaties.

monitor = ,preferred,auto,1

# ── Autostart ──
exec-once = /usr/local/bin/bearly-theme-init
exec-once = waybar
exec-once = hyprpaper
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
exec-once = dunst
exec-once = nwg-dock-hyprland -d -i 48 -mb 10
# Opent het installatieprogramma, alleen in de live-sessie:
exec-once = /usr/local/bin/bearly-live-install

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum

# ── Invoer ──
input {
    kb_layout = us
    follow_mouse = 1
    touchpad { natural_scroll = yes }
    sensitivity = 0
}

# ── Uiterlijk: het glas ──
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(F4A63Bee) rgba(F4A63B88) 45deg
    col.inactive_border = rgba(ffffff22)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    blur {
        enabled = true
        size = 8
        passes = 3
        ignore_opacity = true
        xray = false
    }
    active_opacity = 0.96
    inactive_opacity = 0.90
    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = glass, 0.22, 1, 0.36, 1
    animation = windows, 1, 6, glass, popin 70%
    animation = windowsOut, 1, 6, glass, popin 70%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, glass, slide
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# ── Sneltoetsen ──
$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive,
bind = $mod, E, exec, dolphin
bind = $mod, B, exec, brave
bind = $mod, W, exec, nm-connection-editor
bind = $mod, R, exec, rofi -show drun
bind = $mod, F, fullscreen,
bind = $mod, Space, togglefloating,
bind = $mod, M, exit,
bind = $mod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Werkruimtes 1-5
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
