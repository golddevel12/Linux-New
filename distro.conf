# Basisinstellingen van je distro. Pas deze waarden aan naar wens.

# Naam zoals die op het inlogscherm, in /etc/issue en in "PRETTY_NAME" verschijnt
DISTRO_NAME="Linux-New"

# Korte naam zonder spaties, gebruikt voor de bestandsnaam van de ISO
IMAGE_NAME="linux-new"

# Label van het ISO-volume (max. 32 tekens, geen spaties)
ISO_VOLUME="LINUX_NEW"

# Debian-versie waarop de distro gebaseerd is (bookworm = Debian 12)
DEBIAN_RELEASE="bookworm"

# Instellingen voor de live-sessie
LIVE_HOSTNAME="linux-new"
LIVE_USERNAME="user"
LIVE_LOCALE="nl_NL.UTF-8"
LIVE_KEYBOARD="us"            # bijv. "be" voor Belgisch AZERTY
LIVE_TIMEZONE="Europe/Amsterdam"
