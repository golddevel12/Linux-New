# ── Merk / identiteit ─────────────────────────────────────────────
# Dit is JOUW distro. Pas deze waarden gerust aan.

DISTRO_NAME="BearlyOS"          # naam op loginscherm, os-release, /etc/issue
IMAGE_NAME="bearlyos"           # bestandsnaam van de ISO (geen spaties)
ISO_VOLUME="BEARLYOS"           # volumelabel (max 32 tekens, geen spaties)

# ── Basis ─────────────────────────────────────────────────────────
DEBIAN_RELEASE="bookworm"       # Debian 12

# ── Live-sessie ───────────────────────────────────────────────────
LIVE_HOSTNAME="bearly"
LIVE_USERNAME="bear"            # inlognaam in de live-sessie (wachtwoord: live)
LIVE_FULLNAME="Bearly-IT"      # geen spaties (komt in de kernel-opstartregel)
LIVE_LOCALE="nl_NL.UTF-8"
LIVE_KEYBOARD="us"             # "be" = Belgisch AZERTY, "us" = US QWERTY
LIVE_TIMEZONE="Europe/Amsterdam"
